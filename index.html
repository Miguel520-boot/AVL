<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nodos.css">
    <title>BalanceTree</title>
</head>
<body>

    <article>
        <section>
            <h1>BalanceTree</h1>
            <div class="control-group">
                <input type="number" id="numero" placeholder="Número a insertar">
                <button onclick="arbol.agregarNodo()">Insertar</button>
            </div>

            <div class="control-group">
                <button onclick="ejecutarRecorrido('inorden')">Inorden</button>
                <button onclick="ejecutarRecorrido('preorden')">Preorden</button>
                <button onclick="ejecutarRecorrido('postorden')">Postorden</button>
            </div>

            <div class="recorridos-panel">
                <h2>Recorridos</h2>
                <div class="recorrido-result">
                    <span id="recorrido-result">—</span>
                </div>
            </div>

            <div class="control-group">
                <input type="number" id="numero-eliminar" placeholder="Número a eliminar">
                <button onclick="arbol.eliminarNodo()">Eliminar</button>
            </div>

            <div class="speed-control">
                <label for="speed-slider">Velocidad:</label>
                <input type="range" id="speed-slider" min="0.25" max="2" step="0.25" value="1">
                <span id="speed-value">1.0x</span>
            </div>

            <div class="info-bar">
                <span>Nodos: <b id="count">0</b></span>
                <span>Altura: <b id="tree-height">—</b></span>
            </div>
        </section>

        <section style="display:flex; flex-direction:column; padding:1rem; overflow:hidden;">
            <div id="tree-canvas">
                <span id="empty-msg">Agrega un número para comenzar</span>
                <svg id="svg"></svg>
            </div>
        </section>
    </article>

    <footer>
        <p>Copyright © 2024 BalanceTree. All rights reserved.</p>
    </footer>

    <script src="js/nodo.js"></script>
    <script src="js/render.js"></script>
    <script src="js/rotacion.js"></script>
    <script src="js/animaciones.js"></script>
</body>
</html>
